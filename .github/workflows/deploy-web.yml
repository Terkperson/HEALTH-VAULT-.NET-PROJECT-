name: Build and Deploy HealthVault Web UI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore HealthVault/src/HealthVault.Web/HealthVault.Web.csproj

    - name: Build with dotnet
      run: dotnet build HealthVault/src/HealthVault.Web/HealthVault.Web.csproj --configuration Release --no-restore

    - name: Publish with dotnet
      run: dotnet publish HealthVault/src/HealthVault.Web/HealthVault.Web.csproj --configuration Release --no-build --output ./myweb

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'healthvault-web-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
        package: './myweb'
